name: Android CI/CD & Play Store Prep

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper / Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit & Robolectric Tests
        run: gradle :testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release App Bundle (AAB for Google Play Console)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # If keystore base64 secret is provided, decode it into project root for signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="my-upload-key.jks"
          fi
          gradle bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact (Google Play Store Ready)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/outputs/bundle/release/app-release.aab

  # Optional Play Store automatic publishing job (triggers when tagged or manually dispatched)
  publish-to-play-store:
    needs: build-and-test
    name: Publish to Google Play Console (Internal / Alpha Track)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle
          path: build/outputs/bundle/release/

      - name: Deploy to Google Play Console
        uses: r0adkll/upload-google-play@v11
        with:
          service_account_json_raw_base64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
          packageName: 'com.aistudio.edupulse.vbwl'
          releaseFiles: build/outputs/bundle/release/app-release.aab
          track: 'internal' # Options: internal, alpha, beta, production
          inAppUpdatePriority: 3
